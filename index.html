<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Let's Move" />
  <title>Let's Move - AI Workout Tracker</title>

  <!-- MediaPipe Pose & Drawing Utils (100% Client-Side, Gratis Selamanya) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    
    .header { width: 100%; max-width: 640px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .header h1 { font-size: 1.35rem; font-weight: 800; color: #38bdf8; letter-spacing: -0.5px; }
    .badge { background: #1e293b; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; border: 1px solid #334155; }

    .selector-box {
      width: 100%; max-width: 640px; margin-bottom: 12px;
    }
    select {
      width: 100%; padding: 12px 16px; border-radius: 12px; background: #1e293b;
      color: #f8fafc; font-size: 1rem; font-weight: 600; border: 1px solid #38bdf8;
      outline: none; cursor: pointer;
    }

    .camera-container {
      position: relative; width: 100%; max-width: 640px; aspect-ratio: 4/3;
      background: #000; border-radius: 16px; overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2px solid #1e293b;
    }
    video, canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
    }

    .hud-overlay {
      position: absolute; top: 12px; left: 12px; right: 12px;
      display: flex; justify-content: space-between; pointer-events: none; z-index: 10;
    }
    .counter-box {
      background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(6px);
      padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .counter-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; }
    .counter-value { font-size: 2.5rem; font-weight: 800; color: #38bdf8; line-height: 1.1; }

    .status-box {
      background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(6px);
      padding: 10px 14px; border-radius: 12px; text-align: right; border: 1px solid #334155;
    }
    .stage-text { font-size: 1.05rem; font-weight: 700; color: #fbbf24; }
    .angle-text { font-size: 0.85rem; color: #cbd5e1; margin-top: 2px; }

    .progress-bar-bg {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 8px; background: rgba(255,255,255,0.15); z-index: 10;
    }
    .progress-bar-fill {
      height: 100%; width: 0%; background: #22c55e; transition: width 0.1s ease;
    }

    .controls {
      width: 100%; max-width: 640px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px;
    }
    button {
      padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    .btn-start { background: #22c55e; color: #052e16; grid-column: span 2; }
    .btn-reset { background: #334155; color: #f8fafc; }
    .btn-save { background: #0284c7; color: #ffffff; }

    .tips {
      width: 100%; max-width: 640px; margin-top: 14px; background: #1e293b;
      padding: 14px; border-radius: 12px; font-size: 0.85rem; color: #cbd5e1; line-height: 1.5;
    }
    .tips strong { color: #38bdf8; }
    #loadingText {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #38bdf8; font-weight: 600; text-align: center; z-index: 5; padding: 0 20px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Let's Move</h1>
    <div class="badge">Hari Ini: <strong id="todayTotal">0</strong></div>
  </div>

  <div class="selector-box">
    <select id="exerciseSelect" onchange="changeExercise()">
      <option value="pushup">Push-Up</option>
      <option value="squat">Squat</option>
      <option value="situp">Sit-Up</option>
      <option value="jumpingjack">Jumping Jacks</option>
    </select>
  </div>

  <div class="camera-container">
    <div id="loadingText">Pilih gerakan lalu klik "Mulai Kamera"</div>
    <video id="videoElement" playsinline></video>
    <canvas id="canvasElement"></canvas>

    <div class="hud-overlay">
      <div class="counter-box">
        <div class="counter-label" id="exerciseLabel">Push-Up</div>
        <div class="counter-value" id="repCount">0</div>
      </div>
      <div class="status-box">
        <div class="stage-text" id="stageText">SIAP</div>
        <div class="angle-text"><span id="metricName">Sudut</span>: <span id="angleVal">-</span></div>
      </div>
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="depthBar"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-start" id="startBtn" onclick="startApp()">Mulai Kamera</button>
    <button class="btn-reset" onclick="resetSession()">Reset Sesi</button>
    <button class="btn-save" onclick="saveToHistory()">Simpan ke Total Hari Ini</button>
  </div>

  <div class="tips" id="tipText">
    <strong>Tips Push-Up:</strong> Posisikan kamera di lantai dari arah <strong>samping atau serong depan</strong> agar bahu, siku, dan pergelangan tangan terlihat jelas.
  </div>

  <script>
    const videoElement = document.getElementById('videoElement');
    const canvasElement = document.getElementById('canvasElement');
    const canvasCtx = canvasElement.getContext('2d');
    const repCountEl = document.getElementById('repCount');
    const stageTextEl = document.getElementById('stageText');
    const angleValEl = document.getElementById('angleVal');
    const metricNameEl = document.getElementById('metricName');
    const depthBarEl = document.getElementById('depthBar');
    const loadingText = document.getElementById('loadingText');
    const startBtn = document.getElementById('startBtn');
    const todayTotalEl = document.getElementById('todayTotal');
    const exerciseSelect = document.getElementById('exerciseSelect');
    const exerciseLabel = document.getElementById('exerciseLabel');
    const tipText = document.getElementById('tipText');

    let currentExercise = 'pushup';
    let count = 0;
    let stage = "UP";
    let isRunning = false;

    const exerciseConfig = {
      pushup: {
        name: "Push-Up",
        metric: "Sudut Siku",
        tip: "<strong>Tips Push-Up:</strong> Posisikan kamera di lantai dari arah <strong>samping atau serong depan</strong> agar bahu, siku, dan pergelangan tangan terlihat jelas."
      },
      squat: {
        name: "Squat",
        metric: "Sudut Lutut",
        tip: "<strong>Tips Squat:</strong> Berdiri sekitar 2 meter dari kamera (sudut <strong>serong depan atau samping</strong>) agar pinggul, lutut, dan pergelangan kaki terlihat penuh."
      },
      situp: {
        name: "Sit-Up",
        metric: "Sudut Pinggul",
        tip: "<strong>Tips Sit-Up:</strong> Posisikan kamera dari <strong>arah samping</strong> agar tubuh bagian atas (bahu), pinggul, dan lutut yang ditekuk terlihat jelas."
      },
      jumpingjack: {
        name: "Jumping Jacks",
        metric: "Bukaan Tangan",
        tip: "<strong>Tips Jumping Jacks:</strong> Berdiri menghadap <strong>lurus ke depan kamera</strong> dari jarak 2-2,5 meter agar seluruh tubuh dari kepala sampai kaki masuk layar."
      }
    };

    const todayKey = new Date().toISOString().slice(0, 10);

    function loadTodayTotal() {
      const saved = parseInt(localStorage.getItem(`letsmove_${currentExercise}_${todayKey}`) || '0');
      todayTotalEl.innerText = saved;
    }
    loadTodayTotal();

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'id-ID';
        utterance.rate = 1.1;
        window.speechSynthesis.speak(utterance);
      }
    }

    function changeExercise() {
      currentExercise = exerciseSelect.value;
      const cfg = exerciseConfig[currentExercise];
      exerciseLabel.innerText = cfg.name;
      metricNameEl.innerText = cfg.metric;
      tipText.innerHTML = cfg.tip;
      resetSession();
      loadTodayTotal();
      if (isRunning) speak("Mode " + cfg.name);
    }

    function calculateAngle(a, b, c) {
      const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
      let angle = Math.abs(radians * 180.0 / Math.PI);
      if (angle > 180.0) angle = 360 - angle;
      return Math.round(angle);
    }

    // Pilih sisi tubuh (kiri/kanan) yang visibilitasnya paling jelas
    function getBestSide(lm, leftIdx, rightIdx) {
      const lVis = leftIdx.reduce((sum, i) => sum + lm[i].visibility, 0) / leftIdx.length;
      const rVis = rightIdx.reduce((sum, i) => sum + lm[i].visibility, 0) / rightIdx.length;
      if (lVis < 0.5 && rVis < 0.5) return null;
      return lVis >= rVis ? leftIdx.map(i => lm[i]) : rightIdx.map(i => lm[i]);
    }

    function onResults(results) {
      loadingText.style.display = 'none';
      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, { color: '#38bdf8', lineWidth: 3 });
        drawLandmarks(canvasCtx, results.poseLandmarks, { color: '#22c55e', lineWidth: 2, radius: 4 });

        const lm = results.poseLandmarks;

        if (currentExercise === 'pushup') {
          // Bahu (11/12), Siku (13/14), Pergelangan Tangan (15/16)
          const pts = getBestSide(lm, [11, 13, 15], [12, 14, 16]);
          if (pts) {
            const angle = calculateAngle(pts[0], pts[1], pts[2]);
            angleValEl.innerText = angle + "°";
            depthBarEl.style.width = Math.min(100, Math.max(0, ((160 - angle) / 75) * 100)) + '%';

            if (angle <= 90) {
              stage = "DOWN";
              stageTextEl.innerText = "BAWAH (DORONG!)";
              stageTextEl.style.color = "#22c55e";
            }
            if (angle >= 155 && stage === "DOWN") {
              stage = "UP";
              incrementRep();
            }
          } else {
            showOutOfFrame();
          }

        } else if (currentExercise === 'squat') {
          // Pinggul (23/24), Lutut (25/26), Pergelangan Kaki (27/28)
          const pts = getBestSide(lm, [23, 25, 27], [24, 26, 28]);
          if (pts) {
            const angle = calculateAngle(pts[0], pts[1], pts[2]);
            angleValEl.innerText = angle + "°";
            depthBarEl.style.width = Math.min(100, Math.max(0, ((170 - angle) / 80) * 100)) + '%';

            if (angle <= 95) {
              stage = "DOWN";
              stageTextEl.innerText = "BAWAH (NAIK!)";
              stageTextEl.style.color = "#22c55e";
            }
            if (angle >= 160 && stage === "DOWN") {
              stage = "UP";
              incrementRep();
            }
          } else {
            showOutOfFrame();
          }

        } else if (currentExercise === 'situp') {
          // Bahu (11/12), Pinggul (23/24), Lutut (25/26)
          const pts = getBestSide(lm, [11, 23, 25], [12, 24, 26]);
          if (pts) {
            const angle = calculateAngle(pts[0], pts[1], pts[2]);
            angleValEl.innerText = angle + "°";
            depthBarEl.style.width = Math.min(100, Math.max(0, ((130 - angle) / 75) * 100)) + '%';

            if (angle <= 65) {
              stage = "UP_CRUNCH";
              stageTextEl.innerText = "PUNCAK (TURUN!)";
              stageTextEl.style.color = "#22c55e";
            }
            if (angle >= 125 && stage === "UP_CRUNCH") {
              stage = "DOWN_FLAT";
              incrementRep();
            }
          } else {
            showOutOfFrame();
          }

        } else if (currentExercise === 'jumpingjack') {
          // Cek posisi tangan di atas kepala & kaki terbuka (tampak depan)
          const lWrist = lm[15], rWrist = lm[16], nose = lm[0];
          const lAnkle = lm[27], rAnkle = lm[28], lHip = lm[23], rHip = lm[24];

          if (lWrist.visibility > 0.5 && rWrist.visibility > 0.5 && lAnkle.visibility > 0.5 && rAnkle.visibility > 0.5) {
            // Sudut lengan terhadap badan (Pinggul -> Bahu -> Pergelangan Tangan)
            const leftArmAngle = calculateAngle(lm[23], lm[11], lm[15]);
            const rightArmAngle = calculateAngle(lm[24], lm[12], lm[16]);
            const avgArmAngle = Math.round((leftArmAngle + rightArmAngle) / 2);

            // Jarak kaki dibanding lebar pinggul
            const ankleDist = Math.abs(lAnkle.x - rAnkle.x);
            const hipWidth = Math.abs(lHip.x - rHip.x);
            const legSpreadRatio = ankleDist / (hipWidth || 0.1);

            angleValEl.innerText = avgArmAngle + "°";
            depthBarEl.style.width = Math.min(100, Math.max(0, ((avgArmAngle - 20) / 130) * 100)) + '%';

            if (avgArmAngle >= 145 && legSpreadRatio >= 1.4) {
              stage = "OPEN";
              stageTextEl.innerText = "TERBUKA (TUTUP!)";
              stageTextEl.style.color = "#22c55e";
            }
            if (avgArmAngle <= 45 && legSpreadRatio <= 1.2 && stage === "OPEN") {
              stage = "CLOSED";
              incrementRep();
            }
          } else {
            showOutOfFrame();
          }
        }
      }
      canvasCtx.restore();
    }

    function incrementRep() {
      count++;
      repCountEl.innerText = count;
      stageTextEl.innerText = "BAGUS!";
      stageTextEl.style.color = "#38bdf8";
      speak(count.toString());
    }

    function showOutOfFrame() {
      stageTextEl.innerText = "POSISIKAN TUBUH";
      stageTextEl.style.color = "#f87171";
      angleValEl.innerText = "-";
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      enableSegmentation: false,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });
    pose.onResults(onResults);

    async function startApp() {
      if (isRunning) return;
      isRunning = true;
      startBtn.style.display = 'none';
      loadingText.innerText = "Memuat model AI (hanya beberapa detik)...";

      const camera = new Camera(videoElement, {
        onFrame: async () => {
          await pose.send({ image: videoElement });
        },
        facingMode: 'user',
        width: 640,
        height: 480
      });
      camera.start();
      speak("Let's Move aktif, silakan mulai");
    }

    function resetSession() {
      count = 0;
      stage = "READY";
      repCountEl.innerText = "0";
      stageTextEl.innerText = "SIAP";
      stageTextEl.style.color = "#fbbf24";
      depthBarEl.style.width = "0%";
    }

    function saveToHistory() {
      if (count === 0) return;
      const key = `letsmove_${currentExercise}_${todayKey}`;
      const currentSaved = parseInt(localStorage.getItem(key) || '0');
      const newTotal = currentSaved + count;
      localStorage.setItem(key, newTotal);
      todayTotalEl.innerText = newTotal;
      speak(`Tersimpan. Total ${exerciseConfig[currentExercise].name} hari ini ${newTotal}`);
      resetSession();
    }
  </script>
</body>
</html>
